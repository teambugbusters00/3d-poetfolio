<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Portfolio</title><style>body{margin:0;background:#090d18;color:#fff;font:16px system-ui}canvas{display:block}main{position:absolute;top:12%;left:8%;max-width:540px;pointer-events:none}h1{font-size:clamp(3rem,8vw,6rem);margin:.2em 0}p{color:#c6d2e5}.links a{pointer-events:auto;color:#7ee7ff;margin-right:16px}</style></head><body><main><p>CREATIVE DEVELOPER</p><h1>Ideas in<br>motion.</h1><p>A 3D portfolio starter. Replace this copy and links with real work.</p><div class="links"><a href="#work">Work</a><a href="mailto:hello@example.com">Contact</a></div></main><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x090d18);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);camera.position.z=5;const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);const mesh=new THREE.Mesh(new THREE.IcosahedronGeometry(1.45,1),new THREE.MeshStandardMaterial({color:0x28b8d8,wireframe:true}));scene.add(mesh);scene.add(new THREE.PointLight(0xffffff,35));function animate(){requestAnimationFrame(animate);mesh.rotation.x+=.002;mesh.rotation.y+=.004;renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
